# !!!!! PROVENANCE / F-L1 HONESTY (read before editing) !!!!!
# proteins_provenance MUST be a real structure RELEASE_TAG or content hash before F-L1 / METHODS.
# Leaving REPLACE_WITH_REAL_* (or any placeholder) = fake provenance → flow targets F-L0 / provisional, NOT F-L1.
# If proteins are not ready → set proteins_ready: false (plan blocks; do not claim Target F-L1).
# Defaults keep proteins_ready true + REPLACE_* only so classroom can generate a plan; REPLACE is not provenance.
# prefer_fast: true → framework F2 (usually F-L0). Default false = framework F1.
# structure_grade is self-declared — flow does not read the structure repo.
# FA flow answers — python3 pipeline/flow_tool/flow.py --answers ...

# Input readiness
proteins_ready: true
proteins_provenance: "REPLACE_WITH_REAL_structure_RELEASE_TAG_or_sha256"  # MUST replace before claiming F-L1 / METHODS — placeholder ≠ provenance
structure_grade: L1          # L0 | L1 | L2 (your claim only)

# Frame choice
prefer_fast: false           # true → F2 (emapper±Kofam), skip full IPS for now
use_entap: false             # F3
transcriptome_only: false    # F5 Trinotate lane

# Optional plant add-ons (after F1)
want_ahrd: false  # optional plant naming; not required for F-L1
want_mercator: false
want_orthofinder: false
want_nlr: false
want_itak: false

species_label: "Species_v1"
notes: ""
